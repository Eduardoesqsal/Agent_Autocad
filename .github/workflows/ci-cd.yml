name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: |
          ruff check autocad_mcp/
          ruff format --check autocad_mcp/

      - name: Type check
        run: |
          pip install mypy
          mypy autocad_mcp/ --ignore-missing-imports

      - name: Run tests
        shell: pwsh
        run: |
          if (Test-Path tests) {
            pytest tests/ -v
          } else {
            Write-Host "No tests directory found; skipping pytest."
          }

      - name: Validate project structure
        run: |
          python -c "import autocad_mcp; print('Import OK')"

  build-artifact:
    needs: lint-and-test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Package project
        run: |
          pip install build
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autocad-mcp-package
          path: dist/

  deploy:
    needs: build-artifact
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Notify deployment
        run: |
          echo "Deployment step completed for ${{ github.ref }}"
